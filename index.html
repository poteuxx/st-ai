<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ST·AI — SolutionsTechnologies Intelligence Artificielle</title>
  
  <!-- SEO & Brand -->
  <meta name="description" content="ST·AI par SolutionsTechnologies — Votre assistant IA multi-modèles gratuit. Propre, rapide, et confidentiel." />
  <meta name="author" content="SolutionsTechnologies" />
  <meta name="theme-color" content="#0b0d11" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  
  <!-- Style -->
  <link rel="stylesheet" href="style.css" />
  
  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <!-- SPLASH SCREEN -->
  <div id="splash" class="splash">
    <div class="splash-inner">
      <div class="splash-logo">
        <svg class="splash-icon" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="22" stroke="url(#lg)" stroke-width="2.5"/>
          <path d="M14 24 Q24 10 34 24 Q24 38 14 24Z" fill="url(#lg)" opacity="0.8"/>
          <circle cx="24" cy="24" r="5" fill="#fff"/>
          <defs><linearGradient id="lg" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#00d4ff"/></linearGradient></defs>
        </svg>
      </div>
      <span class="splash-brand">ST·AI</span>
      <div class="splash-bar"><div class="splash-fill"></div></div>
      <p style="color:var(--text-muted); font-size:0.8rem; margin-top:20px;">Initialisation de l'IA...</p>
    </div>
  </div>

  <div class="app" id="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="14" stroke="url(#bg)" stroke-width="2"/>
            <path d="M9 16 Q16 7 23 16 Q16 25 9 16Z" fill="url(#bg)" opacity="0.9"/>
            <circle cx="16" cy="16" r="3" fill="#fff"/>
            <defs><linearGradient id="bg" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#00d4ff"/></linearGradient></defs>
          </svg>
          <div class="brand-text">
            <span class="brand-name">ST·AI</span>
            <span class="brand-sub">SolutionsTechnologies</span>
          </div>
        </div>
      </div>

      <div class="sidebar-actions">
        <button class="action-btn primary-action" onclick="newChat()">
          <span>+ Nouvelle discussion</span>
        </button>
        <button class="action-btn" onclick="openImageGen()">
          <span>🎨 Créer une image</span>
        </button>
      </div>

      <div class="chat-list" id="chatList">
        <!-- Chats injected via JS -->
      </div>

      <div style="padding: 20px; border-top: 1px solid var(--border);">
        <button class="action-btn" onclick="openSettings()">⚙️ Paramètres</button>
        <div style="margin-top: 12px; font-size: 0.7rem; color: var(--text-muted); text-align: center;">
          © 2025 SolutionsTechnologies™
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <header class="topbar">
        <button onclick="toggleSidebar()" style="padding:10px;">☰</button>
        
        <div class="model-picker">
          <button class="model-btn" id="modelBtn" onclick="toggleModelMenu()">
            <div class="model-dot" id="modelDot"></div>
            <span id="modelLabel">GPT-4o (Pollinations)</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          
          <div class="model-menu" id="modelMenu">
            <div class="model-menu-title">Modèles IA <span class="copy-mark">©ST</span></div>
            
            <div class="model-group-label">Gratuits (Sans Clé)</div>
            <button class="model-option" data-model="openai" data-provider="pollinations" data-color="#00d4ff" onclick="selectModel(this)">
              <div class="mo-info"><span class="mo-name">GPT-4o (Standard)</span><span class="mo-desc">Accès libre via Pollinations</span></div>
              <span class="mo-badge free">FREE</span>
            </button>
            <button class="model-option" data-model="mistral" data-provider="pollinations" data-color="#8b5cf6" onclick="selectModel(this)">
              <div class="mo-info"><span class="mo-name">Mistral Large</span><span class="mo-desc">Performances européennes</span></div>
              <span class="mo-badge free">FREE</span>
            </button>
            
            <div class="model-group-label">Vitesse Groq (Clé Recommandée)</div>
            <button class="model-option" data-model="llama-3.1-8b-instant" data-provider="groq" data-color="#8b5cf6" onclick="selectModel(this)">
              <div class="mo-info"><span class="mo-name">Llama 3.1 8B</span><span class="mo-desc">Vitesse instantanée</span></div>
              <span class="mo-badge nokey">GSK</span>
            </button>
            <button class="model-option" data-model="deepseek-r1-distill-llama-70b" data-provider="groq" data-color="#e11d48" onclick="selectModel(this)">
              <div class="mo-info"><span class="mo-name">DeepSeek R1</span><span class="mo-desc">Raisonnement avancé</span></div>
              <span class="mo-badge nokey">GSK</span>
            </button>
          </div>
        </div>
        
        <div style="width: 40px;"></div>
      </header>

      <div class="chat-area" id="chatArea">
        <!-- Welcome -->
        <div class="welcome" id="welcome">
          <div class="welcome-glow"></div>
          <div class="welcome-content">
            <h1 class="welcome-title">Bienvenue sur ST·AI</h1>
            <p class="welcome-sub">L'Intelligence Artificielle de SolutionsTechnologies.</p>
            
            <div class="suggestions">
              <button class="suggestion-card" onclick="sendSuggestion(this)">📦 <span>Explique-moi le cloud computing</span></button>
              <button class="suggestion-card" onclick="sendSuggestion(this)">⚛️ <span>Comment débuter avec React en 2025 ?</span></button>
            </div>
          </div>
        </div>

        <div class="messages" id="messages"></div>

        <!-- Image Gen (simplified for ref) -->
        <div id="imageGenPanel" class="hidden" style="padding: 20px;">
           <h2>🎨 Générateur d'images</h2>
           <input type="text" id="imagePrompt" class="igp-input" style="width:100% " placeholder="Décrivez votre image...">
           <button onclick="generateImage()" class="action-btn primary-action" style="margin-top:10px">Générer</button>
           <div id="igpResults"></div>
           <button onclick="closeImageGen()">Retour</button>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <div class="input-box">
            <textarea id="userInput" class="user-input" placeholder="Posez votre question à ST·AI..." rows="1" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Modal (simplified) -->
  <div id="settingsModal" class="modal-overlay hidden" onclick="closeModal('settingsModal', event)">
     <div class="modal" onclick="event.stopPropagation()">
        <h2>Configuration ST·AI</h2>
        <div style="margin-top:20px">
           <label>Clé API Groq (Optionnel)</label>
           <input type="password" id="groqKey" class="key-input" style="width:100%; border:1px solid var(--border); margin-bottom:15px">
           
           <label>Clé API OpenAI (Optionnel)</label>
           <input type="password" id="openaiKey" class="key-input" style="width:100%; border:1px solid var(--border); margin-bottom:20px">
        </div>
        <button onclick="saveSettings()" class="modal-save-btn">Appliquer</button>
     </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
